services:
  web:
    image: node:22
    working_dir: /app
    command: ["sh", "-ec", "npm ci && exec npx vite --host 0.0.0.0 --port 5173"]
    ports:
      - "3000:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - BASE44_PREVIEW_MODE
    env_file:
      - /run/base44/app.env
    restart: on-failure
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s

volumes:
  node_modules:
