name: Evermont Support Notification Worker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evermont-support-worker
  cancel-in-progress: false

jobs:
  process-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Process queued support notifications
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is missing."
            exit 1
          fi

          curl --fail --silent --show-error --max-time 240 \
            --request GET \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "https://evermontcreditunion-fx1-hubs.vercel.app/api/support-worker"
